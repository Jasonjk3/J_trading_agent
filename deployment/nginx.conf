# =============================================================================
# 前端站点 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#   1. 托管 Vue3 打包产物，history 路由回退到 index.html
#   2. 把 /v1 反向代理到后端容器 backend:5005（含 SSE 流式接口所需配置）
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;

    # 容器内置 DNS；配合变量形式的 proxy_pass，后端重建后无需重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:5005";

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 健康检查（容器 healthcheck 使用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端 API：/v1/** ------------------------------------------------
    # proxy_buffering off 保证智能助手的 text/event-stream 实时下发
    # ---- 后端 API：/v1/** ------------------------------------------------
    # ^~ 保证优先匹配，不被下面的静态资源正则拦截；
    # $request_uri 原样透传路径与查询串（后端路由本身带 /v1 前缀）
    # proxy_buffering off 保证智能助手的 text/event-stream 实时下发
    location ^~ /v1/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- 前端静态资源：Vite 产物带 hash，可长期缓存 ----------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # ---- SPA history 路由回退 -------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 需要对外暴露 Swagger 调试时可解开下面这段（默认关闭更安全）
    # location ^~ /docs {
    #     proxy_pass $backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location = /openapi.json {
    #     proxy_pass $backend;
    #     proxy_set_header Host $host;
    # }
}
